<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Menu - FoodExpress</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="CSS/style.css">
    <link rel="stylesheet" href="CSS/responsive.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
        <div class="container">
            <a class="navbar-brand logo" href="index.html">
                FoodExpress
            </a>

            <div>
                <a href="cart.html" class="btn btn-main">
                    Cart (<span id="cartCount">0</span>)
                </a>
            </div>
        </div>
    </nav>

    <section class="container py-5">

        <h1 class="text-center mb-5">
            Restaurant Menu
        </h1>

        <div class="row g-4" id="foodList">
            <div class="col-12 text-center py-5">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <p class="mt-3">Loading delicious food...</p>
            </div>
        </div>

        <div class="text-center mt-5">
            <a href="cart.html" class="btn btn-success">
                Go To Cart
            </a>
        </div>

    </section>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="JavaScript/script.js"></script>
    <script src="JavaScript/menu-api.js"></script>

</body>
</html>
