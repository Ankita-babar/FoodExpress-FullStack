
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodExpress | Admin Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <style>
        body {
            background: #f4f6f9;
            font-family: Arial, sans-serif;
        }
        .navbar {
            background: #182230;
        }
        .navbar-brand {
            color: white;
            font-weight: bold;
        }
        .dashboard-card {
            background: white;
            border-radius: 12px;
            padding: 22px;
            box-shadow: 0 3px 12px rgba(0,0,0,.07);
        }
        .page-title {
            font-weight: 700;
            color: #182230;
        }
        .form-control, .form-select {
            margin-bottom: 14px;
        }
        .table th {
            white-space: nowrap;
        }
        .status-available {
            color: #198754;
            font-weight: bold;
        }
        .status-unavailable {
            color: #dc3545;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark px-4 py-3">
        <a class="navbar-brand" href="index.html">FoodExpress Admin</a>
        <a href="index.html" class="btn btn-outline-light btn-sm">View Website</a>
    </nav>

    <main class="container py-4">
        <h1 class="page-title mb-2">Admin Dashboard</h1>
        <p class="text-secondary">Manage your restaurant's food menu.</p>

        <div id="message" class="alert d-none" role="alert"></div>

        <div class="row g-4 mt-1">
            <div class="col-lg-4">
                <section class="dashboard-card">
                    <h4 id="formTitle" class="mb-3">Add Food Item</h4>

                    <form id="foodForm">
                        <input type="hidden" id="foodId">

                        <label for="name" class="form-label">Food Name</label>
                        <input id="name" class="form-control" required maxlength="100">

                        <label for="category" class="form-label">Category</label>
                        <input id="category" class="form-control" required maxlength="60"
                               placeholder="e.g. Burger, Pizza">

                        <label for="price" class="form-label">Price (₹)</label>
                        <input id="price" type="number" class="form-control"
                               min="0.01" step="0.01" required>

                        <label for="description" class="form-label">Description</label>
                        <textarea id="description" class="form-control"
                                  rows="3" maxlength="500"></textarea>

                        <div class="form-check mb-3">
                            <input id="available" class="form-check-input"
                                   type="checkbox" checked>
                            <label class="form-check-label" for="available">
                                Available for customers
                            </label>
                        </div>

                        <button id="saveButton" class="btn btn-primary w-100" type="submit">
                            Add Food
                        </button>
                        <button id="cancelButton" class="btn btn-outline-secondary w-100 mt-2 d-none"
                                type="button">
                            Cancel Edit
                        </button>
                    </form>
                </section>
            </div>

            <div class="col-lg-8">
                <section class="dashboard-card">
                    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
                        <h4 class="mb-0">Food Items</h4>
                        <button id="refreshButton" class="btn btn-outline-primary btn-sm">
                            Refresh
                        </button>
                    </div>

                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Name</th>
                                    <th>Category</th>
                                    <th>Price</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="foodTable">
                                <tr>
                                    <td colspan="6" class="text-center">Loading food items...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </section>
            </div>
        </div>
    </main>

    <script src="JavaScript/admin.js"></script>
</body>
</html>
